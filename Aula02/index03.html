<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="./css/style03.css">

    <title>Conteúdo Aula02 - CSS</title>
  </head>
  <body>
    
    <h1>Bordas com o CSS</h1>

    <h3>Definindo estilos de bordas</h3>

    <p class="dotted">Borda estilo dotted</p>
    <p class="dashed">Borda estilo dashed</p>
    <p class="solid">Borda estilo solid</p>
    <p class="double">Borda estilo double</p>
    <p class="groove">Borda estilo groove</p>
    <p class="ridge">Borda estilo ridge</p>
    <p class="inset">Borda estilo inset</p>
    <p class="outset">Borda estilo outset</p>
    <p class="none">Borda estilo none</p>
    <p class="hidden">Borda estilo hidden</p>

    <hr>

  </body>
